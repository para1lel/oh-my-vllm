# Hooks use installed project tools through the portable environment wrapper.
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Reject Rust formatting drift; run cargo fmt --all to fix it.
        entry: scripts/with-env.sh cargo fmt --all --check
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)rustfmt\.toml$|^\.pre-commit-config\.yaml$)

      - id: rust-line-width
        name: Rust hard line-width limit (including macros)
        entry: scripts/with-env.sh python scripts/check_rust_line_width.py
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)rustfmt\.toml$|^scripts/check_rust_line_width\.py$|^\.pre-commit-config\.yaml$)

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust sources, warnings are errors.
        entry: scripts/with-env.sh cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock)$

      - id: cargo-test
        name: cargo test
        description: Run the Rust test suite.
        entry: scripts/with-env.sh cargo test --all
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock)$

      - id: ruff-format
        name: ruff format
        description: Format Python sources in place.
        entry: scripts/with-env.sh ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        description: Lint Python sources, fixing what is auto-fixable.
        entry: scripts/with-env.sh ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]

      - id: whitespace
        name: whitespace
        description: Strip trailing whitespace and enforce a final newline.
        entry: scripts/with-env.sh python scripts/fix_whitespace.py
        language: system
        types: [text]

      - id: documentation
        name: portable bilingual documentation
        entry: scripts/with-env.sh python scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true

fail_fast: false

repos:
  - repo: local
    hooks:
      - id: cuda-format
        name: clang-format and CUDA module size
        description: Format owned CUDA modules and enforce the 800-line limit.
        entry: scripts/with-env.sh python scripts/format_cuda.py
        language: system
        pass_filenames: false
        files: (\.(cu|cuh|cpp|hpp|h)$|^python/oh_my_vllm/operators/.*\.py$|^\.clang-format$|^scripts/format_cuda\.py$|^\.pre-commit-config\.yaml$)

      - id: cargo-fmt
        name: cargo fmt
        description: Reject Rust formatting drift; run cargo fmt --all to fix it.
        entry: scripts/with-env.sh python scripts/run_cargo_hook.py fmt
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)rustfmt\.toml$|^scripts/run_cargo_hook\.py$|^\.pre-commit-config\.yaml$)

      - id: rust-line-width
        name: Rust hard line-width limit (including macros)
        entry: scripts/with-env.sh python scripts/check_rust_line_width.py
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)rustfmt\.toml$|^scripts/check_rust_line_width\.py$|^\.pre-commit-config\.yaml$)

      - id: definition-spacing
        name: function and module definition spacing
        entry: scripts/with-env.sh python scripts/check_definition_spacing.py
        language: system
        pass_filenames: false
        files: (\.(rs|py|js|mjs|cjs|ts)$|^Cargo\.(toml|lock)$|^development/javascript/package(-lock)?\.json$|^\.pre-commit-config\.yaml$)

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust sources, warnings are errors.
        entry: scripts/with-env.sh python scripts/run_cargo_hook.py clippy
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock)$|^scripts/run_cargo_hook\.py$

      - id: cargo-test
        name: cargo test
        description: Run the Rust test suite.
        entry: scripts/with-env.sh python scripts/run_cargo_hook.py test
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock)$|^scripts/run_cargo_hook\.py$|^(python|tests)/.*\.py$

      - id: ruff-format
        name: ruff format
        description: Format Python sources in place.
        entry: scripts/with-env.sh ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        description: Lint Python sources, fixing what is auto-fixable.
        entry: scripts/with-env.sh ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]

      - id: kernel-contracts
        name: model evidence, HTTP accounting, and worker contracts
        entry: scripts/with-env.sh python -m unittest development.model.test_identity development.model.test_logits development.model.deepseek_v41.test_identity development.model.deepseek_v41.test_layout development.model.deepseek_v41.test_quantization development.model.deepseek_v41.test_weights development.model.deepseek_v41.test_engram development.model.deepseek_v41.test_memory development.model.deepseek_v41.test_reference development.model.deepseek_v41.test_reference_cases development.model.deepseek_v41.test_reference_image development.model.deepseek_v41.test_reference_media development.model.deepseek_v41.test_reference_media_case.MediaCaseReference development.model.deepseek_v41.test_reference_long_case.LongCaseReference development.model.deepseek_v41.test_reference_video development.model.deepseek_v41.test_sampling_reference development.model.deepseek_v41.test_codec_reference development.model.deepseek_v41.test_video_codec development.model.deepseek_v41.test_fixtures tests.test_model_registry tests.test_model_descriptor tests.test_model_ready tests.test_constraints development.serving.test_roofline development.serving.test_agentx tests.test_execution tests.test_transfers tests.test_offload_worker development.operators.test_contracts development.operators.test_lifecycle development.operators.test_performance tests.test_operator_plans
        language: system
        pass_filenames: false
        files: ^(development/|python/oh_my_vllm/|tests/).*\.(py|cu|cuh)$|^development/operators/.*\.(json|npz)$|^development/model/reference\.npz$|^development/model/deepseek_v41/(reference\.npz|dspark\.npz|media\.npz|codec\.json|video_codec\.json)$|^requirements/|^\.pre-commit-config\.yaml$

      - id: whitespace
        name: whitespace
        description: Strip trailing whitespace and enforce a final newline.
        entry: scripts/with-env.sh python scripts/fix_whitespace.py
        language: system
        types: [text]

      - id: documentation
        name: portable bilingual documentation
        entry: scripts/with-env.sh python scripts/check_docs.py --fix-source-links
        language: system
        pass_filenames: false
        always_run: true

      - id: glossary
        name: generated glossary source consistency
        entry: scripts/with-env.sh python scripts/build_glossary.py --check
        language: system
        pass_filenames: false
        files: (^docs/(terms\.json|glossary(\.zh)?\.md)$|^scripts/build_glossary\.py$|^\.pre-commit-config\.yaml$)

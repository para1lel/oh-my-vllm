# Python lint/format settings, shared by the pre-commit hook and manual runs.
# Apply the same format in hooks and manual checks.
line-length = 88
target-version = "py312"

[lint]
select = [
	"E", # pycodestyle errors
	"F", # pyflakes
	"I", # import sorting
	"UP", # pyupgrade
	"B", # bugbear
	"SIM", # simplify
	"RUF",
]

[format]
docstring-code-format = true

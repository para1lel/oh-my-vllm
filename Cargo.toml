[workspace]
members = [
    "crates/kv-cache",
    "crates/scheduler",
    "crates/zmq-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Pin the compatible workspace dependencies.
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive", "env"] }
rustc-hash = "2.1.1"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "ipc-transport"] }

oh-my-vllm-kv-cache = { path = "crates/kv-cache" }
oh-my-vllm-scheduler = { path = "crates/scheduler" }

[profile.release]
# The scheduler + KV cache are latency-critical and small enough that whole-program
# optimization is cheap; we care about per-step CPU time, not build time.
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

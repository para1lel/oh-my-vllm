[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-vllm"
version = "0.1.0"
description = "Rust-accelerated inference framework for hybrid attention/Mamba models"
requires-python = ">=3.12"
dependencies = [
    "pyzmq==27.2.0",
    "msgpack==1.2.2",
    "torch==2.14.0",
    "numpy==2.5.3",
    "flashinfer-python[cu13]==0.6.18.post1",
    "transformers==5.17.0",
    "safetensors==0.8.0",
    "xgrammar==0.2.7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oh_my_vllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
